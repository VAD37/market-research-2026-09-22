<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="100%" role="img" aria-label="GEO 정비 전후 AI 검색 노출률 비교(익명)"><text x="16" y="24" fill="#0b1220" font-size="14" font-weight="700">AI 검색 노출률 — 정비 전 → 정비 후 (병원명 비공개)</text><text x="16" y="58" fill="#0b1220" font-size="13" font-weight="700">영통OOO치과 · 정비함</text><rect x="16" y="64" width="480" height="18" rx="5" fill="#eef2f1"/><rect x="16" y="64" width="324" height="18" rx="5" fill="#0f766e"/><text x="352" y="78" fill="#0f766e" font-size="12" font-weight="700">11% → 27% (+16%p)</text><text x="16" y="118" fill="#0b1220" font-size="13" font-weight="700">강남OOO치과 · 비교군(정비 안 함)</text><rect x="16" y="124" width="480" height="18" rx="5" fill="#eef2f1"/><rect x="16" y="124" width="120" height="18" rx="5" fill="#b6babf"/><text x="148" y="138" fill="#6b7280" font-size="12" font-weight="700">11% → 10% (제자리)</text><text x="16" y="172" fill="#9ca3af" font-size="10">N=2 관찰(통제 실험 아님) · 인과 단정 아님 · 효과 보장 아님 · 같은 중립 측정으로 전후 비교</text></svg>